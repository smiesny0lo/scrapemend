# Review attack B4c on layout v2: the item container only matches rows with an
# amount in euros, so the notices whose value is "Not disclosed" (9 of 200) are never
# read again: under the 10% of records the shadow run may miss, all of one kind.
confidence: 0.9
container:
  xpath: //table[@class='tender-table']//tr[@class='tender-row'][contains(td[@class='col-amount'], '€')]
fields:
  authority:
    strategies:
    - css: dd.tender__buyer
    - label: Contracting authority
  category:
    strategies:
    - css: dd.tender__category
    - label: Category
  deadline:
    strategies:
    - css: dd.tender__closing
    - label: Deadline
  description:
    strategies:
    - css: div.tender__description p
  location:
    strategies:
    - css: dd.tender__location
    - label: Location
  published:
    strategies:
    - css: dd.tender__published
    - label: Published
  reference:
    strategies:
    - css: dd.tender__ref
    - label: Reference
  status:
    strategies:
    - css: dd.tender__status
    - label: Status
  title:
    strategies:
    - css: h1.tender__title
  value:
    strategies:
    - css: dd.tender__amount
    - regex: Estimated value:?\s*(€\s?[\d,.]+)
follow:
  css: a.tender-link::attr(href)
next_page:
  css: a[rel=next]::attr(href)
rationale: 'Layout v2 renamed every class (tr.notice -> tr.tender-row, dd.deadline -> dd.tender__closing,
  ...) and replaced the pager list with rel=next links. The page structure is the same, so new CSS selectors
  restore every field. Label fallbacks are kept, because the dt/dd labels survived the redesign.

  '
