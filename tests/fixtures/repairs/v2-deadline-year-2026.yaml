# Review attack B2 on layout v2: deadline hard-codes the year every example showed
# (2026), with a looser fallback, the first date in 2026 on the page. Every deadline
# the last good run knows is right; a notice published since, with a 2027 deadline,
# gets its publication date instead: wrong, but filled, so a required field passes.
confidence: 0.9
container:
  css: table.tender-table tr.tender-row
fields:
  authority:
    strategies:
    - css: dd.tender__buyer
    - label: Contracting authority
  category:
    strategies:
    - css: dd.tender__category
    - label: Category
  deadline:
    strategies:
    - regex: Deadline (\d{1,2} \w{3} 2026)
    - regex: (\d{1,2} \w{3} 2026)
  description:
    strategies:
    - css: div.tender__description p
  location:
    strategies:
    - css: dd.tender__location
    - label: Location
  published:
    strategies:
    - css: dd.tender__published
    - label: Published
  reference:
    strategies:
    - css: dd.tender__ref
    - label: Reference
  status:
    strategies:
    - css: dd.tender__status
    - label: Status
  title:
    strategies:
    - css: h1.tender__title
  value:
    strategies:
    - css: dd.tender__amount
    - regex: Estimated value:?\s*(€\s?[\d,.]+)
follow:
  css: a.tender-link::attr(href)
next_page:
  css: a[rel=next]::attr(href)
rationale: 'Layout v2 renamed every class (tr.notice -> tr.tender-row, dd.deadline -> dd.tender__closing,
  ...) and replaced the pager list with rel=next links. The page structure is the same, so new CSS selectors
  restore every field. Label fallbacks are kept, because the dt/dd labels survived the redesign.

  '
