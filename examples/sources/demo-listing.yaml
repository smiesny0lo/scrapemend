# A listing-only spec for the mutating demo site: every field is read from the
# listing table, and no detail page is fetched. Written against layout v1.
# Start the site first:  python -m examples.mutating_site
id: tenders-listing-demo
version: 1

fetch:
  start: http://127.0.0.1:8000/notices
  paginate:
    next: { css: "li.next a::attr(href)" }
    max_pages: 20
  rate: { rps: 20 }  # a local demo site; real sites deserve 1 or less

item:
  container: { css: "table.notices tr.notice" }
  # Without detail pages every item shares its listing page's URL, so the key is a
  # field. Titles repeat; the link to the notice (never fetched) identifies it.
  key: link

fields:
  link:
    type: url
    required: true
    strategies:
      - css: "td.title a::attr(href)"
  title:
    required: true
    strategies:
      - css: "td.title a"
  authority:
    required: true
    strategies:
      - css: "td.authority"
  deadline:
    type: date
    required: true
    date_format: "%d %b %Y"
    strategies:
      - css: "td.deadline"
  value:
    type: decimal
    volatile: true
    normalize: [strip_currency]
    null_values: ["Not disclosed"]
    strategies:
      - css: "td.value"

expect:
  min_items_per_run: 200
  max_null_rate:
    value: 0.15

heal:
  mode: propose
  anchors: 10
  shadow_max_items: all  # verify repairs on every record; the default reads a sample of 500
