# A hand-written repair of examples/sources/demo-listing.yaml for demo layout v2.
# scrapemend heal examples/sources/demo-listing.yaml --patch examples/repairs/demo-listing-v2.yaml
rationale: >
  Layout v2 renamed the listing table's classes (tr.notice -> tr.tender-row,
  td.authority -> td.col-buyer, ...) and replaced the pager list with rel=next links.
confidence: 0.9
container: { css: "table.tender-table tr.tender-row" }
next_page: { css: "a[rel=next]::attr(href)" }
fields:
  link:
    strategies: [{ css: "a.tender-link::attr(href)" }]
  title:
    strategies: [{ css: "a.tender-link" }]
  authority:
    strategies: [{ css: "td.col-buyer" }]
  deadline:
    strategies: [{ css: "td.col-closing" }]
  value:
    strategies: [{ css: "td.col-amount" }]
