# A hand-written repair of examples/sources/demo-listing.yaml for demo layout v3.
# specmend heal examples/sources/demo-listing.yaml --patch examples/repairs/demo-listing-v3.yaml
rationale: >
  Layout v3 turned the table into a grid of cards with utility classes. Each card
  has the authority on top, the title link in its h3, a "Deadline: ..." line and
  the value in a bold line; pagination is numbered, with an aria-labelled next link.
confidence: 0.8
container: { css: "div.grid > div.rounded-lg" }
next_page: { css: "a[aria-label='Next page']::attr(href)" }
fields:
  link:
    strategies: [{ css: "h3 a::attr(href)" }]
  title:
    strategies: [{ css: "h3 a" }]
  authority:
    strategies: [{ css: "div.uppercase" }]
  deadline:
    strategies: [{ label: { text: Deadline, relation: after } }]
  value:
    strategies: [{ css: "p.font-semibold" }]
