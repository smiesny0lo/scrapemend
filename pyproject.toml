[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "specmend"
description = "A self-healing scraper engine: detect layout breakage, propose spec repairs, verify against known-good anchors."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dynamic = ["version"]
keywords = ["scraping", "self-healing", "web-scraping", "llm", "data-quality"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "lxml>=5.3",
    "cssselect>=1.2",
    "google-re2>=1.1",  # regexes from repair providers run in linear time
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "specmend[demo,anthropic]",
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-PyYAML",
    "lxml-stubs",
]
# Mutating demo site in examples/ (not shipped in the wheel).
demo = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1"]
anthropic = ["anthropic>=2.3"]

[project.scripts]
specmend = "specmend.cli:app"

[tool.hatch.version]
path = "src/specmend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specmend"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "examples"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["re2"]  # google-re2 has no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that start the demo site",
]
